# Server
server.port=8080

# H2 DataSource (Oracle compatibility mode)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:nexacrodb;MODE=Oracle;DATABASE_TO_UPPER=false;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/init.sql

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Log
logging.level.com.example.nexacro=DEBUG
logging.level.org.apache.poi=WARN
